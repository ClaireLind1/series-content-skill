<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1208" viewBox="0 0 750 1132.5" style="display:block;width:100%;height:auto;background-color:#E4FF00;" font-family="Microsoft YaHei, PingFang SC, sans-serif"><g><rect width="750" height="1740" fill="#E4FF00" /><g><rect width="750" height="1740" fill="#E4FF00" /><path d="M40 66H710M40 1678H710" stroke="#181818" /><text x="42" y="45" font-size="18" font-weight="700" fill="#181818">SERIES CONTENT SKILL</text><text x="540" y="45" font-size="16" font-weight="400" fill="#181818">创作实验室 001</text><text x="45" y="125" font-size="58" font-weight="900" fill="#181818">我做了个 Skill</text><text x="45" y="205" font-size="48" font-weight="900" fill="#181818">把笔记整理成公众号文章</text><path d="M48 225 Q310 245 628 224" fill="none" stroke="#FF79B9" stroke-width="12" stroke-dasharray="650" stroke-dashoffset="650"><animate attributeName="stroke-dashoffset" values="650;650;0;0;650" keyTimes="0;.1;.3;.85;1" dur="7s" repeatCount="indefinite" /></path><text x="48" y="280" font-size="23" font-weight="400" fill="#181818">从看剧笔记、读书摘录到公众号成稿</text><rect x="78" y="348" width="605" height="630" rx="18" fill="#C6BAFF" /><rect x="58" y="328" width="605" height="630" rx="18" fill="#FFF9E9" stroke="#181818" /><g><animateTransform attributeName="transform" type="translate" values="-18 -12;-18 -12;0 0;0 0;-18 -12" keyTimes="0;0.1;0.3;0.85;1" dur="7s" repeatCount="indefinite" /><rect x="233" y="309" width="220" height="45" fill="#FF83BD" transform="rotate(-6 343 331)" /></g><text x="100" y="399" font-size="15" font-weight="700" fill="#7B2970">从笔记到成稿</text><g><animateTransform attributeName="transform" type="translate" values="90 150;90 150;0 0;0 0;90 150" keyTimes="0;0.1;0.3;0.85;1" dur="7s" repeatCount="indefinite" /><text x="100" y="473" font-size="48" font-weight="700" fill="#181818">零散笔记，</text></g><g><animateTransform attributeName="transform" type="translate" values="-55 -70;-55 -70;0 0;0 0;-55 -70" keyTimes="0;0.1;0.3;0.85;1" dur="7s" repeatCount="indefinite" /><text x="100" y="535" font-size="38" font-weight="700" fill="#181818">先理清，再成文。</text></g><g><animateTransform attributeName="transform" type="translate" values="40 150;40 150;0 0;0 0;40 150" keyTimes="0;0.1;0.3;0.85;1" dur="7s" repeatCount="indefinite" /><text x="100" y="601" font-size="24" font-weight="400" fill="#181818">把零散的记录归到几个主题。</text></g><g><animateTransform attributeName="transform" type="translate" values="-30 -140;-30 -140;0 0;0 0;-30 -140" keyTimes="0;0.1;0.3;0.85;1" dur="7s" repeatCount="indefinite" /><text x="100" y="646" font-size="24" font-weight="400" fill="#181818">按阅读顺序组织段落。</text></g><g><animateTransform attributeName="transform" type="translate" values="40 120;40 120;0 0;0 0;40 120" keyTimes="0;0.2;0.4;0.85;1" dur="7s" repeatCount="indefinite" /><rect x="100" y="692" width="520" height="104" rx="12" fill="#E4FF00" /><text x="125" y="736" font-size="25" font-weight="700" fill="#181818">有疑问的地方先标出来，</text><text x="125" y="774" font-size="25" font-weight="700" fill="#181818">查清楚再写进正文。</text></g><rect x="100" y="835" width="480" height="7" rx="3" fill="#BDB1E6"><animate attributeName="width" values="80;80;480;480;80" keyTimes="0;.2;.5;.85;1" dur="7s" repeatCount="indefinite" /></rect><rect x="100" y="860" width="430" height="7" rx="3" fill="#BDB1E6"><animate attributeName="width" values="80;80;430;430;80" keyTimes="0;.2;.5;.85;1" dur="7s" repeatCount="indefinite" /></rect><rect x="100" y="885" width="495" height="7" rx="3" fill="#BDB1E6"><animate attributeName="width" values="80;80;495;495;80" keyTimes="0;.2;.5;.85;1" dur="7s" repeatCount="indefinite" /></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.62;.85;1" dur="7s" repeatCount="indefinite" /><g transform="rotate(-12 577 914)"><rect x="465" y="883" width="220" height="62" rx="12" fill="#FF83BD" stroke="#181818" /><text x="490" y="924" font-size="30" font-weight="900" fill="#181818">成稿预览 ✓</text></g></g><text x="48" y="1050" font-size="32" font-weight="800" fill="#181818">01 / 提供自己的笔记</text><text x="48" y="1097" font-size="23" font-weight="400" fill="#181818">读书摘录、课程记录或已有草稿都可以。</text><text x="48" y="1178" font-size="32" font-weight="800" fill="#181818">02 / 整理成文或只做排版</text><text x="48" y="1225" font-size="23" font-weight="400" fill="#181818">按需整理、润色，或保留原文只做排版。</text><text x="48" y="1306" font-size="32" font-weight="800" fill="#181818">03 / 排好，直接复制</text><text x="48" y="1353" font-size="23" font-weight="400" fill="#181818">生成公众号 HTML，粘贴后检查手机预览。</text><rect x="42" y="1420" width="666" height="195" rx="18" fill="#C6BAFF" /><text x="70" y="1471" font-size="34" font-weight="800" fill="#181818">从一篇短笔记开始。</text><text x="70" y="1525" font-size="34" font-weight="800" fill="#181818">喜欢的版式可以接着用。</text><text x="70" y="1580" font-size="21" font-weight="400" fill="#181818">series-content-skill · 我的开源项目</text><text x="48" y="1715" font-size="23" font-weight="700" fill="#181818">The Pitt 医学英语系列是我的使用案例。</text></g></g></svg>